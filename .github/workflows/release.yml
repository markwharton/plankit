name: release

# pk release pushes the version tag; this workflow turns the tag into a
# GitHub release carrying everything installers need: the versioned
# plugin archive, a fixed-name copy for latest/download URLs, the raw
# platform binaries, and the published marketplace.json whose archive
# source carries the versioned URL and sha256. The pin is a derived
# value, so it lives on the release as an asset and is mirrored by the
# site; it is never committed to a source branch. Last, the plugin's
# files alone, shims but no binaries, are committed to the plugin
# branch, which the Claude plugin directory tracks; that branch is a
# distribution, not a source, and nothing is developed there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_DISPATCH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cross-compile platform binaries, stamped with the tag's version
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Refuse an unstamped binary
        run: |
          got=$(./bin/pk-linux-amd64 --version)
          test "$got" = "pk ${GITHUB_REF_NAME#v}" || { echo "binary reports '$got', expected 'pk ${GITHUB_REF_NAME#v}'"; exit 1; }

      - name: Assemble plugin archive and marketplace
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/.claude-plugin"
          cp .claude-plugin/plugin.json .claude-plugin/icon.png "$STAGE/.claude-plugin/"
          cp -R skills hooks bin "$STAGE/"
          cp LICENSE CHANGELOG.md README.md "$STAGE/"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/plankit-$TAG.zip" .)
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          cp "plankit-$TAG.zip" plankit.zip
          SHA=$(sha256sum "plankit-$TAG.zip" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/plankit-$TAG.zip"
          # The in-repo manifest is the template: name, owner, and
          # descriptions come from it; only the source is derived.
          jq --arg url "$URL" --arg sha "$SHA" \
            '.plugins[0].source = {source: "archive", url: $url, sha256: $sha}
             | .description = "plankit marketplace: install plan-driven development for Claude Code"' \
            .claude-plugin/marketplace.json > marketplace.json
          # checksums.txt covers every asset; the Homebrew tap reads the
          # four platform binaries' lines to bump its formula.
          sha256sum bin/pk-* "plankit-$TAG.zip" plankit.zip marketplace.json | sed 's|bin/||' > checksums.txt

      - name: Create GitHub release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "plankit $TAG" --generate-notes \
            "plankit-$TAG.zip" plankit.zip marketplace.json checksums.txt bin/pk-*

      # Fire-and-forget: the tap's daily schedule covers a failed ping.
      - name: Notify the Homebrew tap
        if: env.TAP_DISPATCH_TOKEN != ''
        continue-on-error: true
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAP_DISPATCH_TOKEN" \
            https://api.github.com/repos/markwharton/homebrew-plankit/dispatches \
            -d '{"event_type":"bump-formula"}')
          echo "tap dispatch: HTTP $status (204 is accepted)"
          test "$status" = 204

      # The same staged tree without the binaries, committed on top of
      # the plugin branch's last release: a fast-forward, never a force.
      # The shim finds pk on the PATH there, so the plugin works from
      # this branch for anyone who has installed pk.
      - name: Commit the plugin tree to the plugin branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          TAG="${GITHUB_REF_NAME}"
          LIST=$(mktemp -d)
          cp -R "$STAGE"/. "$LIST"/
          rm -f "$LIST"/bin/pk-*
          PARENT=""
          if git fetch -q origin plugin; then PARENT=$(git rev-parse FETCH_HEAD); fi
          export GIT_INDEX_FILE=$(mktemp -u)
          git --work-tree="$LIST" add -A
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "plankit $TAG")
          git push -q origin "${COMMIT}:refs/heads/plugin"


  site:
    needs: release
    uses: ./.github/workflows/site.yml
    secrets: inherit
