<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>control lab</title>
<style>
/* One dark instrument panel. A colour means one thing everywhere:
   cyan = structure and reads, amber = writes and warnings, red = an invalid
   value or a refusal that fails, green = done or held, violet = a refusal
   that reached a place. */
:root {
  --bg: #060a0f; --panel: #0b1219; --panel2: #0f1822; --line: #1d2b3a; --ink: #d3e7f5; --muted: #6d889e;
  --cyan: #4fd8ff; --amber: #ffb547; --red: #ff5d62; --green: #58e6a0; --violet: #c794ff; --given: #9fb9cc;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.app { max-width: 1680px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
h1 span { color: var(--cyan); font-family: var(--mono); }
h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.cols { display: grid; grid-template-columns: minmax(340px, 0.72fr) minmax(0, 1.6fr); gap: 12px; align-items: start; }
.cols.noed { grid-template-columns: minmax(0, 1fr); }
.cols.noed #edpane { display: none; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.main { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.row + .row { margin-top: 8px; }
.lbl { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; min-width: 54px; }
button, select, input[type="text"] { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 10px; font-size: 12.5px; }
button { cursor: pointer; }
button:hover:not(:disabled), select:hover { border-color: var(--cyan); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
button.brk { font-family: var(--mono); font-size: 12px; }
button.brk .v, .tag { font-family: var(--sans); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; margin-left: 6px; }
button.go { border-color: var(--green); color: var(--green); }
select { max-width: 100%; }
.v-held { color: var(--green); } .v-nohold { color: var(--amber); } .v-bad { color: var(--red); } .v-plain { color: var(--muted); }
.tabs button { font-size: 12.5px; padding: 5px 14px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
#state { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
#state.live { color: var(--green); border-color: var(--green); } #state.draft { color: var(--amber); border-color: var(--amber); }
#state.refused { color: var(--red); border-color: var(--red); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 12.5px; color: var(--muted); }
.stats b { color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.stats .up { color: var(--red); } .stats .down { color: var(--green); } .stats .same { color: var(--muted); }
#readout { font-size: 14px; border-left: 3px solid var(--cyan); padding: 2px 0 2px 10px; }
#readout.bad { border-left-color: var(--red); } #readout.warn { border-left-color: var(--amber); } #readout.ok { border-left-color: var(--green); }
#readout b { font-family: var(--mono); font-weight: 600; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
textarea#ed { width: 100%; height: min(70vh, 760px); min-height: 320px; resize: vertical; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; padding: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.5; tab-size: 2; white-space: pre; }
#edstatus { font-size: 12.5px; margin-top: 8px; display: grid; gap: 4px; }
#edstatus .bad { color: var(--red); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
#edstatus .note { color: var(--amber); }
#stage { overflow-x: auto; }
#stage svg { display: block; }
#note { color: var(--muted); font-size: 13px; display: grid; gap: 4px; }
#note b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.flist { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 12.5px; }
.flist li { border-left: 2px solid var(--amber); padding-left: 8px; overflow-wrap: anywhere; }
.flist li.acc, .flist li.gone { border-left-color: var(--green); } .flist li.new { border-left-color: var(--red); }
.flist li.gone { text-decoration: line-through; color: var(--muted); }
.flist b { font-family: var(--mono); color: var(--amber); font-weight: 600; }
.flist li.acc b { color: var(--green); }
.flist span { color: var(--muted); }
.tag.new { color: var(--red); margin: 0 6px 0 0; text-decoration: none; display: inline-block; } .tag.gone { color: var(--green); margin: 0 6px 0 0; display: inline-block; }
.entry { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; }
.entry + .entry { margin-top: 8px; }
.entry h3 { margin: 0; font-family: var(--mono); font-size: 13px; }
.proof { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 12.5px; }
.proof dt { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 2px; }
.proof dd { margin: 0; }
pre.box { margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
.empty { color: var(--muted); }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel2); border: 1px solid var(--cyan);
  border-radius: 4px; padding: 6px 12px; font-size: 12.5px; }

/* SVG text and marks */
svg text { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
svg .mut { fill: var(--muted); } svg .cy { fill: var(--cyan); } svg .am { fill: var(--amber); } svg .rd { fill: var(--red); }
svg .gr { fill: var(--green); } svg .vi { fill: var(--violet); }
svg .cap { font-family: var(--sans); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--muted); }
svg .name { font-weight: 600; font-size: 12px; }
svg text.mask { paint-order: stroke; stroke: var(--panel); stroke-width: 6px; stroke-linejoin: round; }
.s-given { fill: var(--given); } .s-present { fill: var(--cyan); } .s-empty { fill: var(--muted); } .s-written { fill: var(--green); }
.s-invalid { fill: var(--red); font-weight: 600; } .s-refusal { fill: var(--violet); font-weight: 600; }
.k-given { stroke: var(--given); } .k-present { stroke: var(--cyan); } .k-empty { stroke: var(--line); stroke-dasharray: 3 4; }
.k-written { stroke: var(--green); } .k-invalid { stroke: var(--red); } .k-refusal { stroke: var(--violet); }
.glow-red { filter: drop-shadow(0 0 5px var(--red)); } .glow-cy { filter: drop-shadow(0 0 4px var(--cyan)); }
.glow-vi { filter: drop-shadow(0 0 5px var(--violet)); }
.dim { opacity: 0.25; } .off { opacity: 0.4; }
@keyframes flow { to { stroke-dashoffset: -24; } }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: no-preference) {
  .flowing { stroke-dasharray: 6 6; animation: flow 0.9s linear infinite; }
  .pulsing { animation: pulse 1.4s ease-in-out infinite; }
}

/* Tables */
table.g { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
table.g th, table.g td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; white-space: nowrap; }
table.g th.el, table.g td.el { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; }
table.g th.pc { vertical-align: bottom; padding: 6px 2px; }
table.g th.pc span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; font-weight: 500; }
table.g th.pc.broken span { color: var(--red); font-weight: 700; }
table.g td.broken, table.g th.broken { background: #2a1114; }
table.g tr.par td { color: var(--cyan); background: var(--panel2); }
table.g tr.par td.el { background: var(--panel2); }
table.g tr.offrow td { opacity: 0.3; }
table.g .sh { font-family: var(--sans); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
.oc { font-family: var(--sans); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.o-done { color: var(--green); } .o-refused { color: var(--red); } .o-passed-on { color: var(--amber); } .o-not-run { color: var(--muted); }
.c-given { color: var(--given); } .c-present { color: var(--cyan); } .c-empty { color: var(--muted); } .c-written { color: var(--green); }
.c-invalid { color: var(--red); font-weight: 700; } .c-refusal { color: var(--violet); font-weight: 700; }
table.m { border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
table.m th, table.m td { padding: 3px 9px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.m th { font-weight: 500; color: var(--muted); vertical-align: bottom; }
table.m th span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; }
table.m td.l, table.m th.l { text-align: left; }
table.m tr.sel td { background: #10222e; }
table.m tr.pathrow td { color: var(--cyan); font-family: var(--sans); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; text-align: left; padding-top: 10px; }
table.m td.gl { font-size: 14px; }
table.m button { font-family: var(--mono); font-size: 12px; }
table.cmp { border-collapse: collapse; font-size: 12.5px; }
table.cmp th, table.cmp td { text-align: left; padding: 3px 14px 3px 0; border-bottom: 1px solid var(--line); }
table.cmp th { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
table.cmp td.mono { font-size: 12px; }
input[type="range"] { width: min(420px, 100%); accent-color: var(--cyan); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1><span>control</span> lab</h1>
    <select id="scn" aria-label="Design"></select>
    <span id="state"></span>
    <div class="stats" id="stats"></div>
    <span style="margin-left:auto" class="row">
      <span class="lbl" style="min-width:0">Compare with</span>
      <select id="cmp" aria-label="Compare with"></select>
      <button type="button" id="b-ed" aria-pressed="true">Editor</button>
    </span>
  </header>

  <div class="cols" id="cols">
    <section class="panel" id="edpane" aria-label="The definition file">
      <div class="row">
        <h2 style="margin:0;flex:1" id="edtitle">The definition file</h2>
        <button type="button" id="b-new" title="Start a new design from a small starter">New</button>
        <button type="button" id="b-fmt" title="Lay the JSON out again">Format</button>
        <button type="button" id="b-rev" title="Go back to the file as saved">Revert</button>
        <button type="button" id="b-snap" title="Keep this version to compare against">Snapshot</button>
      </div>
      <div class="row" style="margin-bottom:8px">
        <button type="button" id="b-save" class="go">Save</button>
        <input type="text" id="saveas" placeholder="new-name.json or .design" aria-label="Name for a new file" style="flex:1;min-width:120px">
        <button type="button" id="b-saveas">Save as new</button>
      </div>
      <textarea id="ed" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Definition file text"></textarea>
      <div id="edstatus" aria-live="polite"></div>
    </section>

    <div class="main">
      <section class="panel" aria-label="What to look at">
        <div class="row"><span class="lbl">Step</span><span id="c-run" class="row"></span></div>
        <div class="row" id="r-path"><span class="lbl" id="l-path">Path</span><span id="c-path" class="row"></span></div>
        <div class="row"><span class="lbl" id="l-brk">Break</span><span id="c-brk" class="row"></span></div>
      </section>
      <div id="readout" aria-live="polite"></div>
      <nav class="row tabs" id="c-view" aria-label="View"></nav>
      <section class="panel">
        <div id="controls" class="row" style="margin-bottom:10px"></div>
        <div id="stage"></div>
      </section>
      <section class="panel" id="note"></section>
      <nav class="row tabs" id="c-panel" aria-label="Details"></nav>
      <section class="panel" id="panel"></section>
      <section class="panel">
        <div class="legend">
          <span><i style="background:var(--given)"></i>given</span>
          <span><i style="background:var(--cyan)"></i>present, or a read</span>
          <span><i style="background:var(--green)"></i>written, done</span>
          <span><i style="background:var(--amber)"></i>a write, or passed on</span>
          <span><i style="background:var(--red)"></i>invalid, refused, lost</span>
          <span><i style="background:var(--violet)"></i>a refusal that reached a place</span>
          <span><i style="background:var(--muted)"></i>empty, not run</span>
        </div>
      </section>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script>
(function () {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const VIEWS = [
  { id: "rail", label: "Rail", good: "the shape of a step: what runs in order, what branches, and which element a refusal stops at.", weak: "seeing how one place is shared across steps. A wide step needs sideways scrolling." },
  { id: "bus", label: "Bus", good: "all inputs and outputs at once, with no tangle: each place is a horizontal line and each leaf a vertical one. Drag the playhead to watch the values change.", weak: "the tree. Parents are not drawn, so you cannot see where a refusal climbs." },
  { id: "ring", label: "Ring", good: "the whole system at a glance: which places are hubs, which leaves touch many places, and how far an invalid value reaches. Click a dot to isolate its wires.", weak: "order. The ring does not show what runs before what." },
  { id: "grid", label: "Grid", good: "exact lookup. Every read, write, owner and refusal target is one cell, and nothing overlaps however large the design gets.", weak: "flow. It is a table, and you have to read it." },
  { id: "matrix", label: "Matrix", good: "the whole sweep on one screen: every fault of a step, and what each leaf did in it. Click a row to load that fault into the other views.", weak: "structure. It shows outcomes, and the design only by implication." },
];
const PANELS = ["findings", "tests", "compare", "prompts"];
/* A: what is open. S: what is selected. */
const A = { scenarios: [], id: null, live: null, liveRefused: null, draft: null, refused: null, text: "", disk: "", stamp: null,
  diskChanged: false, snaps: [], cmpKey: "", cmp: null, seq: 0, checking: false, prompts: null, error: null };
const S = { runName: null, path: 0, place: null, view: "rail", t: 0, hover: null, timer: null, panel: "findings", promptStep: null };
const store = { get(k) { try { return localStorage.getItem("control-lab." + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem("control-lab." + k, v); } catch (e) { /* storage may be off */ } } };

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Control-Lab": "1" }, body: JSON.stringify(body) } : {});
  let j; try { j = await r.json(); } catch (e) { throw new Error("the lab's server gave no answer: is lab.py still running?"); }
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Select the text and copy it"); } ta.remove(); }
}
const scenario = () => A.scenarios.filter((s) => s.id === A.id)[0] || null;
const dirty = () => A.text !== A.disk;
const shownRes = () => (dirty() && A.draft) ? A.draft : (A.live || A.draft);
const model = () => { const r = shownRes(); return r ? r.model : null; };

/* ---------- reading the checker's model ---------- */
function cur() {
  const V = model(), NODE = {}, PLACE = {};
  V.nodes.forEach((n) => { NODE[n.name] = n; });
  V.places.forEach((p) => { PLACE[p.name] = p; });
  let ri = V.runs.findIndex((r) => r.run === S.runName);
  if (ri < 0) { ri = 0; S.runName = V.runs[0].run; S.path = 0; S.place = null; }
  const rv = V.runs[ri];
  if (S.path >= rv.paths.length) S.path = 0;
  const faults = rv.faults.filter((f) => f.path === S.path);
  const fault = S.place ? faults.filter((f) => f.place === S.place)[0] || null : null;
  if (S.place && !fault) S.place = null;
  const trace = whole(rv, fault ? fault.trace : rv.baselines[S.path]);
  const step = {}, chosen = {};
  trace.steps.forEach((s) => { step[s.element] = s; });
  trace.path.forEach((p) => { chosen[p.or] = p.child; });
  if (S.t > trace.steps.length || S.t < 0) S.t = trace.steps.length;
  return { V, NODE, PLACE, ri, rv, faults, fault, trace, step, chosen };
}
/* A run's trace i, whole. The engine's model sends each trace as a summary, and the server
   sends one whole on request, for the text the shown result was checked with; until it comes
   the summary is drawn with no reads, writes or states. The older checker's traces come whole. */
function whole(rv, i) {
  const t = rv.traces[i];
  if (t.start) return t;
  rv.whole = rv.whole || {};
  if (rv.whole[i]) return rv.whole[i];
  rv.asked = rv.asked || {};
  if (!rv.asked[i]) {
    rv.asked[i] = true;
    const text = shownRes() === A.draft ? A.draftText : null;
    api("/api/trace", { id: A.id, text, run: rv.run, n: i }).then((r) => { rv.whole[i] = r.trace; render(); }, (e) => { rv.asked[i] = false; toast(e.message); });
  }
  return { path: rv.paths[t.path], given: t.given, refusals: t.refusals, start: [], end: [], steps: t.steps.map((s) => ({ element: s.element, outcome: s.outcome, reads: [], writes: [] })) };
}
function leavesUnder(C, name) { const n = C.NODE[name]; return n.children.length ? [].concat(...n.children.map((k) => leavesUnder(C, k))) : [name]; }
function under(C, name, top) { for (let at = name; at; at = C.NODE[at].parent) if (at === top) return true; return false; }
function role(C, name) {
  for (const c of C.trace.refusals) {
    if (c.lostAt === name) return { k: "lost", c };
    if (c.from === name) return { k: !c.through.length && c.to ? "from-report" : "from", c };
    const i = c.through.indexOf(name);
    if (i >= 0) return { k: i === c.through.length - 1 && c.to ? "report" : "through", c };
  }
  return null;
}
function seenIn(list, place) { const x = (list || []).filter((s) => s.place === place)[0]; return x ? x.state : null; }
function vlabel(f) { return f.verdict === "refused" ? (f.held ? "refused, held" : "refused, no hold") : f.verdict; }
function vclass(f) { return f.verdict === "refused" ? (f.held ? "v-held" : "v-nohold") : (f.verdict === "lost" || f.verdict === "passed") ? "v-bad" : "v-plain"; }
function pathText(rv, i) { return rv.paths[i].map((x) => x.or + " → " + x.child).join(", "); }
function happens(rv, f) {
  if (f.what) return esc(f.what);
  const t = rv.traces[f.trace], c = t.refusals[0], b = (s) => "<b>" + esc(s) + "</b>";
  const passed = t.steps.filter((s) => s.outcome === "passed-on").map((s) => s.element);
  if (c && !c.lostAt) return b(c.from) + " refuses it" + (c.through.length ? ", through " + c.through.map(b).join(", ") : "") + ", and the refusal reaches " + b(c.to) + ".";
  if (c) return b(c.from) + " refuses it, and the refusal stops at " + b(c.lostAt) + ", which declares no rejects. Nobody is told.";
  if (f.verdict === "output") return "No leaf of this step reads it, so no refusal can meet it.";
  if (f.verdict === "passed") return passed.map(b).join(", ") + " read it and refused nothing, so what they write is invalid too.";
  return "No leaf read it while it held its invalid value.";
}
/* The state of every place of the step after each leaf: index 0 is the start. */
function timeline(C) {
  const tl = [{}];
  C.trace.start.forEach((s) => { tl[0][s.place] = s.state; });
  C.trace.steps.forEach((st) => {
    const now = Object.assign({}, tl[tl.length - 1]);
    st.writes.forEach((w) => { now[w.place] = w.state; });

      '<ul class="flist">' + d.fresh.map((f) => findingLi(f, "new", '<span class="tag new">new</span>')).join("") + d.gone.map((f) => findingLi(f, "gone", '<span class="tag gone">gone</span>')).join("") + "</ul>" +
      '<p class="empty" style="margin:6px 0 12px">' + d.fresh.length + " new, " + d.gone.length + " gone, " + d.kept + " unchanged findings.</p>" +
      (d.sweep.length ? '<table class="cmp"><thead><tr><th>Step</th><th>Path</th><th>Broken place</th><th>Before</th><th>Now</th></tr></thead><tbody>' + d.sweep.map((r) => { const x = r.b || r.a; return '<tr><td class="mono">' + esc(x.run) + '</td><td class="empty">' + esc(x.path) + '</td><td class="mono">' + esc(x.place) + "</td><td>" + (r.a ? '<span class="' + r.a.cls + '">' + esc(r.a.label) + "</span>" : '<span class="empty">not there</span>') + "</td><td>" + (r.b ? '<span class="' + r.b.cls + '">' + esc(r.b.label) + "</span>" : '<span class="empty">not there</span>') + "</td></tr>"; }).join("") + "</tbody></table>" : "") +
      '<p class="empty" style="margin-top:6px">' + d.sweep.length + " sweep verdicts changed, " + d.sweepSame + " the same.</p>" +
      (d.testsNew.length || d.testsGone.length ? '<p style="margin-top:10px">Tests to write: ' + d.testsNew.map((t) => '<span class="tag new">new</span><code>' + esc(t) + "</code> ").join("") + d.testsGone.map((t) => '<span class="tag gone">gone</span><code>' + esc(t) + "</code> ").join("") + "</p>" : "");
  } else {
    if (V.labels) {                                // a design you can run has prompts of its own
      const pr = A.prompts && A.prompts.runnable;
      p.innerHTML = "<h2>Prompts for a session</h2>" + (!pr ? '<p class="empty">Loading.</p>' : pr.map((x, i) => '<div class="row" style="margin:12px 0 6px"><b>' + esc(x.title) + '</b><button type="button" data-pr="' + i + '" style="margin-left:auto">Copy</button></div><pre class="box">' + esc(x.text) + "</pre>").join("") || '<p class="empty">None found in lab/engine/PROMPTS.md.</p>');
      p.querySelectorAll("button[data-pr]").forEach((b) => b.addEventListener("click", () => copy(pr[+b.dataset.pr].text)));
      return;
    }
    const sc = scenario(), steps = V.runs.map((r) => r.run);
    if (steps.indexOf(S.promptStep) < 0) S.promptStep = C.rv.run;
    const pr = A.prompts && A.prompts.description;
    let body = '<h2>Write a description file from the code</h2>';
    if (!pr) body += '<p class="empty">Loading.</p>';
    else if (!pr.text) body += '<p class="empty">Not available: ' + esc(pr.why) + ".</p>";
    else {
      const text = pr.text.replace("<the step>", S.promptStep).replace("<path>", sc ? sc.file : V.definition);
      body += '<div class="row" style="margin-bottom:8px"><span class="lbl" style="min-width:0">For the step</span>' + steps.map((s) => '<button type="button" data-step="' + esc(s) + '" class="brk" aria-pressed="' + (s === S.promptStep) + '">' + esc(s) + "</button>").join("") + '<button type="button" id="p-desc" style="margin-left:auto">Copy</button></div><pre class="box" id="p-desc-text">' + esc(text) + '</pre><p class="empty" style="margin-top:6px">The checker\'s own prompt, read from <code>control/README.md</code>, with the step and the definition file filled in. Paste it into a session in the repository the step belongs to.</p>';
    }
    body += '<h2 style="margin-top:14px">Write a test for a rule</h2><p class="empty">Each entry under "Tests to write" has a "Copy as a prompt" button. The wording around the checker\'s four lines is the lab\'s.</p>';
    p.innerHTML = body;
    p.querySelectorAll("button[data-step]").forEach((b) => b.addEventListener("click", () => { S.promptStep = b.dataset.step; renderPanel(cur()); }));
    if ($("p-desc")) $("p-desc").addEventListener("click", () => copy($("p-desc-text").textContent));
  }
}

/* ---------- the top bar, the editor's status, and the page ---------- */
function delta(now, base, lowerIsBetter) {
  if (base === null || now === base) return base === null ? "" : ' <span class="same">=</span>';
  const up = now > base; return ' <span class="' + ((up === lowerIsBetter) ? "up" : "down") + '">' + (up ? "▲" : "▼") + Math.abs(now - base) + "</span>";
}
function renderTop() {
  const sc = scenario(), m = model(), sel = $("scn");
  sel.innerHTML = A.scenarios.map((s) => '<option value="' + s.id + '"' + (s.id === A.id ? " selected" : "") + ">" + esc(s.label) + "</option>").join("");
  sel.title = sc ? sc.note || sc.file : "";
  const st = $("state");
  if (A.opening) { st.className = "draft"; st.textContent = "Opening the design… " + Math.floor((Date.now() - A.opening) / 1000) + " s"; }
  else if (A.error) { st.className = "refused"; st.textContent = A.error; }
  else if (A.refused) { st.className = "refused"; st.textContent = dirty() ? "The checker refuses this text" : "The checker refuses this file"; }
  else if (dirty()) { st.className = "draft"; st.textContent = A.checking ? "Checking…" : "Draft: not saved"; }
  else { st.className = "live"; st.textContent = "Live: as saved"; }
  const opts = [["", "nothing"]];
  if (dirty() && A.live) opts.push(["disk", "the saved file"]);
  A.snaps.forEach((s) => opts.push([s.key, s.label]));
  A.scenarios.forEach((s) => { if (s.id !== A.id) opts.push(["scn:" + s.id, s.label]); });
  if (!opts.some((o) => o[0] === A.cmpKey)) { A.cmpKey = ""; A.cmp = null; }
  $("cmp").innerHTML = opts.map((o) => '<option value="' + esc(o[0]) + '"' + (o[0] === A.cmpKey ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("");
  if (!m) { $("stats").innerHTML = ""; return; }
  const t = tally(m), b = A.cmp ? tally(A.cmp.model) : null;
  $("stats").innerHTML = "<span><b>" + t.open + "</b>findings" + delta(t.open, b && b.open, true) + "</span><span><b>" + t.accepted + "</b>accepted</span><span><b>" + t.tests + "</b>tests to write" + delta(t.tests, b && b.tests, true) + "</span><span><b>" + t.faults + "</b>faults played: " +
    ["refused, held", "refused, no hold", "lost", "passed", "output", "unread"].filter((k) => t.by[k]).map((k) => t.by[k] + " " + k).join(", ") + "</span>";
}
function renderEditor() {
  const sc = scenario(), ro = !sc || sc.readonly;
  $("edtitle").textContent = sc ? sc.file : "The definition file";
  $("b-save").disabled = ro || !dirty(); $("b-save").textContent = ro ? "Read-only" : "Save";
  $("b-save").title = ro ? "This design is marked read-only. Take a snapshot to compare, or open your own copy." : "Write the text to " + (sc ? sc.file : "the file");
  $("b-saveas").disabled = ro; $("saveas").disabled = ro;
  $("b-rev").disabled = !dirty();
  const out = [];
  if (A.diskChanged) out.push('<span class="note">The file changed on disk while you were editing. <button type="button" id="b-load">Load it</button></span>');
  if (A.refused) {
    out.push('<span class="note">' + (model() ? "The views show the last version the checker accepted." : "There is nothing to draw until the checker accepts the file.") + "</span>");
    A.refused.forEach((r) => out.push('<span class="bad">' + esc(r) + "</span>"));
  }
  $("edstatus").innerHTML = out.join("");
  if ($("b-load")) $("b-load").addEventListener("click", () => openScenario(A.id, true));
}
function render() {
  renderTop(); renderEditor();
  fill("c-view", VIEWS.map((v) => btn(v.label, v.id === S.view, () => pick({ view: v.id }))));
  const main = model();
  ["c-run", "c-path", "c-brk"].forEach((id) => { $(id).textContent = ""; });
  if (!main) {
    $("readout").className = "bad"; $("readout").textContent = A.error || "The checker refuses this file, so there is nothing to draw. Its reasons are under the editor.";
    $("stage").innerHTML = ""; $("controls").innerHTML = ""; $("note").innerHTML = ""; $("panel").innerHTML = ""; $("c-panel").textContent = "";
    return;
  }
  const C = cur();
  fill("c-run", C.V.runs.map((r) => btn(esc(r.run), r.run === C.rv.run, () => pick({ runName: r.run }), "brk")));
  $("r-path").hidden = C.rv.paths.length < 2;
  if (C.rv.paths.length > 8) {                     // many choices read better as a list than as a wall of chips
    const sel = document.createElement("select");
    sel.id = "s-path"; sel.setAttribute("aria-label", "Given");
    sel.innerHTML = C.rv.paths.map((p, i) => '<option value="' + i + '"' + (i === S.path ? " selected" : "") + ">" + esc(pathText(C.rv, i)) + "</option>").join("");
    sel.addEventListener("change", () => pick({ path: +sel.value }));
    const n = document.createElement("span"); n.className = "lbl"; n.style.minWidth = "0"; n.textContent = C.rv.paths.length + " choices";
    fill("c-path", [sel, n]);
  } else fill("c-path", C.rv.paths.map((p, i) => btn(esc(pathText(C.rv, i) || "the only path"), i === S.path, () => pick({ path: i }))));
  fill("c-brk", [btn("nothing", !S.place, () => pick({ place: null }))].concat(C.faults.map((f) =>
    btn(esc(f.place) + '<span class="v ' + vclass(f) + '">' + esc(vlabel(f)) + "</span>", f.place === S.place, () => pick({ place: f.place }), "brk", f.says || (C.PLACE[f.place] || {}).invalid || ""))));
  const lab = C.V.labels || {};
  $("l-path").textContent = lab.path || "Path"; $("l-brk").textContent = lab.break || "Break";
  const r = $("readout");
  if (!C.fault) { r.className = ""; r.innerHTML = C.V.labels ? "Nothing is wrong in this play of <b>" + esc(C.rv.run) + "</b>. Pick something under Wrong to see what the design does about it." : "Nothing is broken: this is the baseline play of <b>" + esc(C.rv.run) + "</b>. Pick a place under Break to give it an invalid value."; }
  else {
    r.className = C.fault.verdict === "lost" || C.fault.verdict === "passed" ? "bad" : C.fault.verdict === "refused" ? (C.fault.held ? "ok" : "warn") : "";
    r.innerHTML = (C.fault.says ? "<b>" + esc(C.fault.place) + "</b>: " + esc(C.fault.says) : "<b>" + esc(C.fault.place) + "</b> holds " + esc((C.PLACE[C.fault.place] || {}).invalid || "its invalid value")) + '. Verdict: <b class="' + vclass(C.fault) + '">' + esc(vlabel(C.fault)) + "</b>. " + happens(C.rv, C.fault);
  }
  const v = VIEWS.filter((x) => x.id === S.view)[0];
  $("note").innerHTML = "<span><b>" + v.label + " is good at</b> " + v.good + "</span><span><b>It is weak at</b> " + v.weak + "</span>";
  DRAW[S.view](C);
  renderPanel(C);
}

/* ---------- opening, editing, saving ---------- */
async function openScenario(id, keep) {
  stopPlay();
  A.id = id; A.error = null; A.diskChanged = false; A.draft = null; A.refused = null; A.seq++;
  $("cols").dataset.open = ""; $("ed").disabled = true;   /* typing while a design loads would be overwritten */
  store.set("scenario", id);
  if (!keep) { S.runName = null; S.path = 0; S.place = null; S.hover = null; }
  /* a large design takes seconds to play: past a moment, say so and take the last design off
     the stage; a small one opens before anything shows. poll waits while a design opens. */
  A.loading = true;
  const started = Date.now();
  let ticking = null;
  const showing = setTimeout(() => {
    A.opening = started; renderTop();
    $("stage").innerHTML = '<p class="empty">Opening the design…</p>';
    ticking = setInterval(renderTop, 500);
  }, 400);
  try {
    const [src, res] = await Promise.all([api("/api/source?id=" + id), api("/api/model?id=" + id)]);
    A.text = A.disk = src.text; $("ed").value = src.text;
    A.live = res.ok ? res : null; A.refused = res.ok ? null : res.refused;
    const sc = scenario(); A.stamp = sc ? sc.stamp : null;
  } catch (e) { A.live = null; A.error = e.message; }
  clearTimeout(showing); clearInterval(ticking); A.opening = null; A.loading = false;
  S.t = 1e9;
  render();
  $("ed").disabled = false; $("cols").dataset.open = id;
}
let debounce = null;
function edited() {
  A.text = $("ed").value;
  clearTimeout(debounce);
  if (!dirty()) { A.draft = null; A.refused = A.live ? null : A.refused; A.checking = false; render(); return; }
  A.checking = true; renderTop(); renderEditor();
  debounce = setTimeout(checkDraft, 350);
}
async function checkDraft() {
  const seq = ++A.seq, text = A.text;
  try {
    const res = await api("/api/check", { id: A.id, text });
    if (seq !== A.seq) return;
    A.error = null;
    if (res.ok) { A.draft = res; A.draftText = text; A.refused = null; } else A.refused = res.refused;
  } catch (e) { if (seq !== A.seq) return; A.error = e.message; }
  A.checking = false;
  render();
}
async function save(name) {
  try {
    const out = await api("/api/save", name ? { id: A.id, text: A.text, name } : { id: A.id, text: A.text });
    await refreshList();
    toast("Saved " + out.saved);
    $("saveas").value = "";
    await openScenario(name && out.id ? out.id : A.id, !name);
  } catch (e) { toast(e.message); }
}
async function refreshList() { const l = await api("/api/scenarios"); A.scenarios = l.scenarios; A.checker = l.checker; return l; }
async function chooseCompare(key) {
  A.cmpKey = key; A.cmp = null;
  try {
    if (key === "disk") A.cmp = { label: "the saved file", model: A.live.model };
    else if (key.indexOf("snap:") === 0) { const s = A.snaps.filter((x) => x.key === key)[0]; A.cmp = { label: s.label, model: s.model }; }
    else if (key.indexOf("scn:") === 0) { const id = key.slice(4), res = await api("/api/model?id=" + id), sc = A.scenarios.filter((x) => x.id === id)[0]; if (!res.ok) throw new Error("the checker refuses " + sc.label); A.cmp = { label: sc.label, model: res.model }; }
  } catch (e) { toast(e.message); A.cmpKey = ""; }
  if (A.cmp) S.panel = "compare";
  render();
}
const STARTER = { system: "my system", places: [
  { name: "input", outside: true, invalid: "say what makes an input invalid" },
  { name: "store", belongsTo: "do it", lasting: true, invalid: "say what makes a stored value invalid" },
  { name: "message", belongsTo: "do it", invalid: "a message with no text" } ],
  elements: [ { name: "my system", steps: ["do it"] },
    { name: "do it", reads: [{ place: "input" }], writes: [{ place: "store", mode: "write" }, { place: "message", mode: "write" }],
      rejects: { reason: "the input is invalid", to: "message" } } ], unsaid: [] };

async function poll() {
  if (A.loading) return;                                   /* the design being opened has not got its stamp yet */
  try {
    const before = A.scenarios.map((s) => s.id).join(","), checker = A.checker, l = await refreshList(), sc = scenario();
    if (A.error) { A.error = null; return openScenario(A.id || (A.scenarios[0] && A.scenarios[0].id), true); }
    if (!sc) { if (A.scenarios.length) await openScenario(A.scenarios[0].id); return; }
    const changed = sc.stamp !== A.stamp || l.checker !== checker;
    if (changed) {
      A.stamp = sc.stamp;
      if (!dirty()) return openScenario(A.id, true);
      const src = await api("/api/source?id=" + A.id);
      if (src.text !== A.disk) A.diskChanged = true;
      const res = await api("/api/model?id=" + A.id); A.live = res.ok ? res : A.live;
      return checkDraft();
    }
    if (before !== A.scenarios.map((s) => s.id).join(",")) renderTop();
  } catch (e) { if (!A.error) { A.error = e.message; render(); } }
}

$("scn").addEventListener("change", (e) => openScenario(e.target.value));
$("cmp").addEventListener("change", (e) => chooseCompare(e.target.value));
$("ed").addEventListener("input", edited);
$("ed").addEventListener("keydown", (e) => {
  if (e.key === "Tab" && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); const t = e.target, a = t.selectionStart; t.setRangeText("  ", a, t.selectionEnd, "end"); edited(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (!$("b-save").disabled) save(); }
});
$("b-save").addEventListener("click", () => save());
$("b-saveas").addEventListener("click", () => { const n = $("saveas").value.trim(); if (!n) { toast("Give the new file a name ending .json or .design"); $("saveas").focus(); return; } save(n); });
$("b-rev").addEventListener("click", () => { $("ed").value = A.disk; edited(); });
$("b-fmt").addEventListener("click", async () => {
  const sc = scenario();
  if (sc && sc.file.endsWith(".design")) {                     /* a design written as text: the server writes it as the printer does */
    try { const r = await api("/api/format", { id: sc.id, text: $("ed").value }); if (r.refused) { toast(r.refused[0]); return; } $("ed").value = r.text; edited(); } catch (e) { toast(e.message); }
    return;
  }
  try { $("ed").value = JSON.stringify(JSON.parse($("ed").value), null, 2) + "\n"; edited(); } catch (e) { toast("Not valid JSON yet: " + e.message); }
});
$("b-new").addEventListener("click", () => { $("ed").value = JSON.stringify(STARTER, null, 2) + "\n"; edited(); toast("A starter design. Name it and choose Save as new to keep it."); });
$("b-snap").addEventListener("click", () => {
  const res = shownRes(); if (!res) { toast("Nothing to snapshot: the checker refuses this file"); return; }
  const sc = scenario(), n = A.snaps.length + 1;
  A.snaps.push({ key: "snap:" + n, label: "snapshot " + n + ": " + (sc ? sc.label : "") + (dirty() ? " (draft)" : ""), model: res.model });
  toast("Snapshot " + n + " kept. Choose it under Compare with."); renderTop();
});
$("b-ed").addEventListener("click", () => { const off = $("cols").classList.toggle("noed"); $("b-ed").setAttribute("aria-pressed", String(!off)); store.set("editor", off ? "off" : "on"); });
window.addEventListener("beforeunload", (e) => { if (dirty()) { e.preventDefault(); e.returnValue = ""; } });

(async function boot() {
  if (DRAW[store.get("view")]) S.view = store.get("view");
  if (PANELS.indexOf(store.get("panel")) >= 0) S.panel = store.get("panel");
  if (store.get("editor") === "off") { $("cols").classList.add("noed"); $("b-ed").setAttribute("aria-pressed", "false"); }
  const m = /^#([a-z]+)$/.exec(location.hash || ""); if (m && DRAW[m[1]]) S.view = m[1];
  try {
    await refreshList();
    const want = store.get("scenario"), first = A.scenarios.filter((s) => s.id === want)[0] || A.scenarios[0];
    if (!first) { A.error = "No design to open: start lab.py with a definition file or a directory of them."; render(); return; }
    await openScenario(first.id);
    api("/api/prompts").then((p) => { A.prompts = p; if (S.panel === "prompts" && model()) renderPanel(cur()); }).catch(() => {});
  } catch (e) { A.error = e.message; render(); }
  setInterval(poll, 1500);
})();
})();
</script>
</body>
