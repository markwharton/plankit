version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
  # docgen is the one module with a dependency (goldmark); the main
  # module has none to watch.
  - package-ecosystem: "gomod"
    directory: "/tools/docgen"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
