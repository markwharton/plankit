name: ci

on:
  push:
    # The plugin branch is the release workflow's distribution tree,
    # not source: nothing there builds or tests.
    branches: ["**", "!plugin"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: make test
      - name: gofmt drift
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: docgen drift
        run: make docs && git diff --exit-code internal/help/data skills
      - name: site builds
        run: make site

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Left on the latest version on purpose: the newest CLI is what
      # shows a change in plugin validation the day it lands, and this
      # job has a read-only token and no secrets.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugin (strict)
        run: claude plugin validate . --strict
